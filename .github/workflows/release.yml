name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Check out the repository so workflow scripts can access its contents
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Parse the commit message to detect whether a release bump was requested
      - name: Detect release tag in commit message
        id: detect
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if echo "$MSG" | grep -qE '\[(major|minor|patch)\]'; then
            echo "triggered=true" >> "$GITHUB_OUTPUT"
          else
            echo "triggered=false" >> "$GITHUB_OUTPUT"
          fi

      # Read the current version from the VERSION file
      - name: Read version
        if: steps.detect.outputs.triggered == 'true'
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # Create a version tag from the VERSION file and push it to origin
      - name: Create and push tag
        if: steps.detect.outputs.triggered == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      # Bundle the repository contents (excluding git metadata) into a zip archive
      - name: Package release artifact
        if: steps.detect.outputs.triggered == 'true'
        run: zip -r release.zip . --exclude ".git/*" --exclude ".github/*"

      # Publish a GitHub Release with the zip artifact and auto-generated release notes
      - name: Create GitHub Release
        if: steps.detect.outputs.triggered == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            release.zip \
            --title "Release v${{ steps.version.outputs.version }}" \
            --generate-notes
