name: Release

# Releases come from main only. Bump package.json "version" and merge to main.
# The tag is created as part of the GitHub Release (users pin via "Import from GitHub" in Kiro).
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (plus `git fetch --tags` in the gate below) so the gate sees every release
      # tag, including one created by a prior run that was still queued behind this one. No ancestry
      # check is needed on top of that: this only runs on push to main, so HEAD is already on main.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # package.json is the single source of truth for the version.
      - name: Read version from package.json
        id: version
        run: |
          set -euo pipefail
          VERSION=$(jq -er '.version' package.json)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version '$VERSION' is not X.Y.Z — refusing to release"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare version against latest release tag
        id: release_gate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          # grep -E narrows the glob to exact vX.Y.Z. `|| true` because grep exits 1 when nothing
          # matches, which under `pipefail` would fail the step instead of taking the first-release
          # path below.
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$LATEST" ]; then
            echo "No prior release tag — v${VERSION} will be the first release"
            exit 0
          fi
          LATEST_VERSION="${LATEST#v}"
          if [ "$VERSION" = "$LATEST_VERSION" ]; then
            echo "::error::v${VERSION} was already released — bump package.json before merging"
            exit 1
          fi
          TAG_FOR_VERSION="v${VERSION}"
          LOWEST=$(printf '%s\n%s\n' "$TAG_FOR_VERSION" "$LATEST" | sort -V | head -1)
          if [ "$LOWEST" = "$TAG_FOR_VERSION" ]; then
            echo "::error::package.json version ${VERSION} is older than the latest release ${LATEST} — check for an accidental revert"
            exit 1
          fi
          echo "Version ${VERSION} is newer than ${LATEST} — proceeding with release"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Gate the release on the same checks as CI so a release can never ship broken steering/skills.
      - name: Validate before releasing
        run: |
          npm test
          npm run validate

      - name: Steering drift check
        run: |
          npm run gen-steering
          git diff --exit-code -- steering/ \
            || { echo "::error::steering/ is stale at this release — regenerate and commit"; exit 1; }

      - name: Pin-sync drift check
        run: |
          npm run sync-pin
          git diff --exit-code -- POWER.md README.md \
            || { echo "::error::POWER.md/README jfrog-skills pin != sync-skills-vendor.json at this release — regenerate and commit"; exit 1; }

      - name: Vendoring drift check
        run: |
          npm run sync-skills
          git diff --exit-code -- skills/ \
            || { echo "::error::skills/ drifted from the pinned upstream at this release — regenerate and commit"; exit 1; }

      # --target creates the tag as part of the release, so a failure can't leave an orphan tag.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --generate-notes

      # Only when the gate passed: a gate failure means the version was already released, and that
      # release belongs to an earlier run — deleting it here would destroy a shipped release.
      - name: Roll back a partially published release
        if: failure() && steps.release_gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release delete "v${VERSION}" --yes --cleanup-tag || true
