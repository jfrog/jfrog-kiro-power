name: Release

# Releases come from main only. Merge the PR to main, then tag that main commit:
#   git checkout main && git pull && git tag vX.Y.Z && git push origin vX.Y.Z
# (bump package.json "version" to match first). The tag is the release users pin via
# "Import from GitHub" in Kiro; no build artifact is required for a Kiro power.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history so we can check the tag is on main

      # Refuse to release a tag that points at a commit not on main (e.g. a feature branch).
      - name: Ensure the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main. Release only after merging to main."
            exit 1
          fi

      # The tag is pushed by a human before this workflow ever runs, so by the time any check here
      # could fail, the tag already exists and is importable via "Import from GitHub" in Kiro —
      # nothing about the tag *itself* is validated. Catch the two ways that goes wrong: a malformed
      # tag name (the trigger glob `v*` accepts `v1`, `v1.2.3-rc1`, `vfoo`, not just `vX.Y.Z`), and a
      # tag that's not actually newer than the last release (a typo'd or duplicate version number).
      # `sort -V` orders numerically (0.9.0 < 0.10.0), not lexicographically.
      - name: Validate the tag itself (format, and newer than the last release)
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not a valid vX.Y.Z semver tag — refusing to release"
            exit 1
          fi
          git fetch --tags origin
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -v "^${TAG}\$" | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            LOWEST=$(printf '%s\n%s\n' "$TAG" "$LATEST" | sort -V | head -1)
            if [ "$LOWEST" = "$TAG" ]; then
              echo "::error::Tag $TAG is not newer than the latest release ($LATEST) — check for a typo"
              exit 1
            fi
          fi

      # package.json is the single source of truth for the version; the tag has to agree with it.
      # Without this, `git tag v0.2.0` on a commit whose package.json still says 0.1.0 releases
      # happily and ships a power whose manifest disagrees with the tag users installed.
      - name: Ensure the tag matches the package.json version
        run: |
          set -euo pipefail
          PKG_VERSION=$(jq -er '.version' package.json)
          if [ "${GITHUB_REF_NAME#v}" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $PKG_VERSION — bump package.json and re-tag"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Gate the release on the same checks as CI so a tag can never ship broken steering/skills.
      - name: Validate before releasing
        run: |
          npm test
          npm run validate

      - name: Steering drift check
        run: |
          npm run gen-steering
          git diff --exit-code -- steering/ \
            || { echo "::error::steering/ is stale at this tag — regenerate and re-tag"; exit 1; }

      - name: Pin-sync drift check
        run: |
          npm run sync-pin
          git diff --exit-code -- POWER.md README.md \
            || { echo "::error::POWER.md/README jfrog-skills pin != sync-skills-vendor.json at this tag — regenerate and re-tag"; exit 1; }

      - name: Vendoring drift check
        run: |
          npm run sync-skills
          git diff --exit-code -- skills/ \
            || { echo "::error::skills/ drifted from the pinned upstream at this tag — regenerate and re-tag"; exit 1; }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes

      # The tag was already pushed (and publicly importable via Kiro's "Import from GitHub") before
      # this job even started, so a failure above doesn't stop it from existing — it just stops a
      # GitHub Release from being created for it. Delete the tag on any failure so a broken/untested
      # tag doesn't linger as a plausible-looking install target; re-tag after fixing the underlying
      # issue. `if: failure()` runs regardless of which step above failed.
      - name: Delete the tag if the release failed
        if: failure()
        run: |
          echo "::error::Release failed — deleting tag ${GITHUB_REF_NAME} so it can't be imported in this broken state. Fix the issue and re-tag."
          git push origin ":refs/tags/${GITHUB_REF_NAME}"
