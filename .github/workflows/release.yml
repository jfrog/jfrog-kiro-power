name: Release

# Releases come from main only. Merge the PR to main, then tag that main commit:
#   git checkout main && git pull && git tag vX.Y.Z && git push origin vX.Y.Z
# (bump package.json "version" to match first). The tag is the release users pin via
# "Import from GitHub" in Kiro; no build artifact is required for a Kiro power.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history so we can check the tag is on main

      # Refuse to release a tag that points at a commit not on main (e.g. a feature branch).
      - name: Ensure the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main. Release only after merging to main."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Gate the release on the same checks as CI so a tag can never ship broken steering/skills.
      - name: Validate before releasing
        run: |
          npm test
          npm run validate

      - name: Steering drift check
        run: |
          npm run gen-steering
          git diff --exit-code -- steering/ \
            || { echo "::error::steering/ is stale at this tag — regenerate and re-tag"; exit 1; }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
