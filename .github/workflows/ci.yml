name: CI

on:
  push:
    branches: [main, add-cli-and-ide-compability]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No dependencies to install: the tooling is dependency-free Node ESM.
      - name: Unit tests
        run: npm test

      - name: Validate skills, POWER.md, and steering
        run: npm run validate

      # steering/ is generated from skills/ by gen-steering.mjs. It must equal a fresh render,
      # i.e. it was regenerated (not hand-edited) after the last skills change.
      - name: Steering drift check
        run: |
          npm run gen-steering
          git diff --exit-code -- steering/ \
            || { echo "::error::steering/ is stale — run 'npm run gen-steering' and commit the result"; exit 1; }

      # skills/ is vendored from jfrog/jfrog-skills at the pin in sync-skills-vendor.json. Re-vendoring
      # must produce no diff (the committed tree is byte-identical to the pinned upstream). Runs last
      # because sync-skills rewrites skills/.
      # The IDE fetches helper scripts using the tag hardcoded in POWER.md/README. It must equal the
      # pin the steering was generated at, or on-demand scripts could mismatch the shipped steering.
      - name: Pin-sync drift check
        run: |
          npm run sync-pin
          git diff --exit-code -- POWER.md README.md \
            || { echo "::error::POWER.md/README jfrog-skills pin != sync-skills-vendor.json — run 'npm run sync-pin' and commit"; exit 1; }

      # Runs last: sync-skills rewrites skills/ from the pinned upstream; it must produce no diff.
      - name: Vendoring drift check
        run: |
          npm run sync-skills
          git diff --exit-code -- skills/ \
            || { echo "::error::skills/ drifted from the pinned upstream — run 'npm run revendor' and commit"; exit 1; }
